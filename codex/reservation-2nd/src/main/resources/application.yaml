spring:
  application:
    name: reservation-2nd
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

reservation:
  hold:
    duration: PT5M
    expiration-scan-millis: 30000
  request:
    replay-wait-timeout: PT5S
    replay-poll-interval: PT0.05S
