spring:
  application:
    name: coupon-system

  datasource:
    url: jdbc:mysql://localhost:3307/coupon?serverTimezone=Asia/Seoul &characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

server:
  error:
    include-message: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
